<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NEXUS MES - Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --primary: #3b82f6;
      }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        max-width: 420px;
        width: 100%;
        padding: 24px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        text-align: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: rgba(59, 130, 246, 0.1);
        color: var(--primary);
        font-weight: 700;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 16px;
        background: var(--primary);
        color: white;
        font-weight: 600;
        cursor: pointer;
      }

      button:active {
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">MES</div>
      <h1>You are offline</h1>
      <p>Check your connection and try again. Core pages will load once you are back online.</p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
    <script>
      (function recoverWhenOnline() {
        var hasAttemptedRecovery = false;

        function redirectToAppShell() {
          if (hasAttemptedRecovery) return;
          hasAttemptedRecovery = true;
          window.location.replace('/');
        }

        if (navigator.onLine) {
          redirectToAppShell();
          return;
        }

        window.addEventListener('online', redirectToAppShell, { once: true });
      })();
    </script>
  </body>
</html>
